name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Validate React Frontend
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npx eslint src

      - name: Run Production Vite Build
        working-directory: frontend
        run: npm run build

  # 2. Validate Node.js Backend
  node-backend-check:
    name: Node.js Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/node_backend/package.json

      - name: Install Node Dependencies
        working-directory: backend/node_backend
        run: npm install

      - name: Verify Express App Syntax & Routes
        working-directory: backend/node_backend
        run: node -e "const app = require('./src/app'); console.log('App loaded successfully.');"

  # 3. Validate Python AI Backend
  python-backend-check:
    name: Python AI Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/python_backend/requirements.txt

      - name: Install Python Dependencies
        working-directory: backend/python_backend
        run: pip install -r requirements.txt

      - name: Verify FastAPI App Compilation
        working-directory: backend/python_backend
        run: python -c "from main import app; print('FastAPI imported cleanly.')"

  # 4. Verify Docker Container Builds
  docker-build:
    name: Docker Containerization Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend/node_backend
          push: false
          tags: legalsmiths-node:test

      - name: Build Python AI Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend/python_backend
          push: false
          tags: legalsmiths-python:test

