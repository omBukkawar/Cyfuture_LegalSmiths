name: CI/CD Pipeline — LegalSmiths

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────
  # 1. Frontend — Lint & Build
  # ──────────────────────────────────────────
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npx eslint src

      - name: Run Production Vite Build
        working-directory: frontend
        env:
          # Dummy values so Vite build doesn't fail on undefined env vars
          VITE_NODE_API_URL: https://placeholder.onrender.com
          VITE_AI_API_URL: https://placeholder.onrender.com
        run: npm run build

  # ──────────────────────────────────────────
  # 2. Node.js Backend — Syntax & Load Check
  # ──────────────────────────────────────────
  node-backend-check:
    name: Node.js Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/node_backend/package.json

      - name: Install Node Dependencies
        working-directory: backend/node_backend
        run: npm install

      - name: Verify Express App Syntax & Routes
        working-directory: backend/node_backend
        run: node -e "const app = require('./src/app'); console.log('App loaded successfully.');"

  # ──────────────────────────────────────────
  # 3. Python AI Backend — Import Check
  # ──────────────────────────────────────────
  python-backend-check:
    name: Python AI Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/python_backend/requirements.txt

      - name: Install Python Dependencies
        working-directory: backend/python_backend
        run: pip install -r requirements.txt

      - name: Verify FastAPI App Compilation
        working-directory: backend/python_backend
        run: python -c "from main import app; print('FastAPI imported cleanly.')"

  # ──────────────────────────────────────────
  # 4. Docker Build Verification
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Containerization Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Node Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend/node_backend
          push: false
          tags: legalsmiths-node:test

      - name: Build Python AI Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend/python_backend
          push: false
          tags: legalsmiths-python:test

  # ──────────────────────────────────────────
  # 5. Deploy Frontend → Render Static Site
  #    Requires: frontend-check to pass
  # ──────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Render
    needs: frontend-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Frontend Deploy Hook
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --request POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}")
          echo "Render response code: $STATUS"
          echo "$STATUS" | grep -qE "^2" && echo "Frontend deploy triggered." || (echo "Deploy hook failed!" && exit 1)

  # ──────────────────────────────────────────
  # 6. Deploy Node Backend → Render Web Service
  #    Requires: node-backend-check + docker-build to pass
  # ──────────────────────────────────────────
  deploy-node-backend:
    name: Deploy Node Backend to Render
    needs: [node-backend-check, docker-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Node Backend Deploy Hook
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --request POST "${{ secrets.RENDER_DEPLOY_HOOK_NODE }}")
          echo "Render response code: $STATUS"
          echo "$STATUS" | grep -qE "^2" && echo "Node backend deploy triggered." || (echo "Deploy hook failed!" && exit 1)

  # ──────────────────────────────────────────
  # 7. Deploy Python AI Backend → Render Web Service
  #    Requires: python-backend-check + docker-build to pass
  # ──────────────────────────────────────────
  deploy-python-backend:
    name: Deploy Python AI Backend to Render
    needs: [python-backend-check, docker-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Python Backend Deploy Hook
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --request POST "${{ secrets.RENDER_DEPLOY_HOOK_PYTHON }}")
          echo "Render response code: $STATUS"
          echo "$STATUS" | grep -qE "^2" && echo "Python backend deploy triggered." || (echo "Deploy hook failed!" && exit 1)



